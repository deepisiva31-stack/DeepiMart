<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepiMart - Farm to Market</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2316a34a'/%3E%3Ctext%20x='16'%20y='22'%20font-family='Arial'%20font-size='16'%20font-weight='bold'%20fill='white'%20text-anchor='middle'%3EDM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ======================= AUTH VIEW ======================= -->
  <main id="auth-view" class="auth-page">
    <section class="auth-card">
      <header class="auth-header">
        <div class="logo" aria-hidden="true">DM</div>
        <h1>DeepiMart</h1>
        <p class="tagline">Farm to market, made simple.</p>
      </header>

      <div class="tab-bar" role="tablist" aria-label="Authentication">
        <button type="button" class="tab tab-login active" role="tab" aria-selected="true" data-tab="login">Buyer / Farmer</button>
        <button type="button" class="tab tab-register" role="tab" aria-selected="false" data-tab="register">Sign Up</button>
        <button type="button" class="tab tab-admin" role="tab" aria-selected="false" data-tab="admin">Admin</button>
      </div>

      <form id="login-form" class="auth-form active" novalidate>
        <p class="auth-form-title">Buyer / Farmer Login</p>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="email" placeholder="user@example.com" required />
          <p class="field-error" id="login-email-error"></p>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Enter your password" required />
          <p class="field-error" id="login-password-error"></p>
        </div>
        <p class="form-message" id="login-message" role="status"></p>
        <button type="submit" class="btn-primary" id="login-submit">Login</button>
      </form>

      <form id="register-form" class="auth-form" novalidate>
        <div class="field">
          <label for="reg-name">Name</label>
          <input type="text" id="reg-name" name="name" autocomplete="name" placeholder="Your full name" required />
          <p class="field-error" id="reg-name-error"></p>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" autocomplete="email" placeholder="user@example.com" required />
          <p class="field-error" id="reg-email-error"></p>
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" name="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required />
          <p class="field-error" id="reg-password-error"></p>
        </div>
        <div class="field">
          <label for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" name="confirmPassword" autocomplete="new-password" placeholder="Re-enter your password" required />
          <p class="field-error" id="reg-confirm-error"></p>
        </div>
        <div class="field">
          <label for="reg-location">Location (optional)</label>
          <input type="text" id="reg-location" name="location" placeholder="e.g. Kampala, Uganda" />
        </div>
        <fieldset class="field role-field">
          <legend>I am a&hellip;</legend>
          <label class="role-option">
            <input type="radio" name="role" value="farmer" />
            <span class="role-card"><strong>Farmer</strong><small>Sell your produce</small></span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="buyer" />
            <span class="role-card"><strong>Buyer</strong><small>Buy fresh produce</small></span>
          </label>
          <p class="field-error" id="reg-role-error"></p>
        </fieldset>
        <p class="form-message" id="register-message" role="status"></p>
        <button type="submit" class="btn-primary" id="register-submit">Create Account</button>
      </form>

      <form id="admin-login-form" class="auth-form" novalidate>
        <p class="auth-form-title">Admin Login</p>
        <div class="field">
          <label for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" name="email" autocomplete="email" placeholder="admin@example.com" required />
          <p class="field-error" id="admin-email-error"></p>
        </div>
        <div class="field">
          <label for="admin-password">Admin Password</label>
          <input type="password" id="admin-password" name="password" autocomplete="current-password" placeholder="Enter admin password" required />
          <p class="field-error" id="admin-password-error"></p>
        </div>
        <p class="form-message" id="admin-message" role="status"></p>
        <button type="submit" class="btn-primary" id="admin-login-submit">Login</button>
      </form>
    </section>

    <p class="auth-note">
      Demo accounts &mdash; Admin: <strong>admin@deepimart.com</strong> / admin123 &middot; Farmer: <strong>farmer@deepimart.com</strong> / farmer123 &middot; Buyer: <strong>buyer@deepimart.com</strong> / buyer123
    </p>
  </main>

  <!-- ======================= APP SHELL ======================= -->
  <div id="app-view" class="hidden">
    <nav class="topbar">
      <button type="button" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
      <a class="brand" href="#/home">
        <span class="brand-logo">DM</span>
        <span class="brand-name">DeepiMart</span>
      </a>
      <ul class="nav-links" id="nav-links"></ul>
      <div class="topbar-right">
        <button type="button" id="chat-toggle" class="btn-ghost chat-toggle" title="Messages">
          Messages <span id="chat-badge" class="chat-badge hidden">0</span>
        </button>
        <span class="user-chip">
          <img id="nav-avatar" class="nav-avatar" alt="" />
          <span id="nav-role" class="role-badge"></span>
          <span id="nav-name" class="nav-name"></span>
        </span>
        <button type="button" id="logout-btn" class="btn-ghost">Logout</button>
      </div>
    </nav>
    <div class="nav-overlay hidden" id="nav-overlay"></div>
    <main id="view" class="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <aside id="chat-drawer" class="chat-drawer" aria-hidden="true">
    <div class="chat-head">
      <strong>Messages</strong>
      <button type="button" id="chat-close" aria-label="Close">&times;</button>
    </div>
    <div class="chat-body">
      <div id="chat-partners" class="chat-partners"></div>
      <div id="chat-conversation" class="chat-conversation hidden">
        <div class="chat-with" id="chat-with"></div>
        <div class="chat-messages" id="chat-messages"></div>
        <form class="chat-compose" id="chat-form">
          <input type="text" id="chat-input" placeholder="Type a message&hellip;" maxlength="2000" autocomplete="off" />
          <button type="submit" class="btn-primary chat-send">Send</button>
        </form>
      </div>
    </div>
  </aside>
  <div id="chat-overlay" class="chat-overlay hidden"></div>

  <script src="js/core.js"></script>
  <script src="js/product-images.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/farmer.js"></script>
  <script src="js/buyer.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
